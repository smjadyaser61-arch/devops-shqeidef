
services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: shipfast-app

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: "3000"
      APP_VERSION: "1.0.0"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - shipfast-network

networks:
  shipfast-network:
    name: shipfast-network
    driver: bridge

